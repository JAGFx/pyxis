  # --- FAILED ---
  artifact_failed_parent:
    __construct:
      - <(App\Module\Exporter\Domain\Account\Message\Command\RequestExportAccountList\RequestExportAccountListCommand::NAME)>
    createdAt: <immutableDateTimeBetween('-3 days', '-2 days')>

  artifact_failed:
    __construct:
      - <(App\Module\Exporter\Domain\Account\Message\Command\RequestExportAccountList\RequestExportAccountListCommand::NAME)>
    parent: '@artifact_failed_parent'
    finishedAt: <immutableDateTimeBetween('-2 days', '-1 day')>
    createdAt: <immutableDateTimeBetween('-3 days', '-2 days')>

  # --- DISABLED ---
  artifact_disabled_parent:
    __construct:
      - <(App\Module\Exporter\Domain\Account\Message\Command\RequestExportAccountList\RequestExportAccountListCommand::NAME)>
    createdAt: <immutableDateTimeBetween('-5 days', '-4 days')>

  artifact_disabled:
    __construct:
      - <(App\Module\Exporter\Domain\Account\Message\Command\RequestExportAccountList\RequestExportAccountListCommand::NAME)>
    parent: '@artifact_disabled_parent'
