services:
  # To test production build
#  php:
#    image: ghcr.io/jagfx/pyxis-php:latest
#    networks:
#      - app_network

  php:
    image: pyxis-php:latest
    container_name: pyxis-php
    build:
      context: .
      dockerfile: ./docker/php/Dockerfile
      target: dev
    environment:
      XDEBUG_MODE: debug,coverage
      XDEBUG_SESSION: PHPSTORM
      XDEBUG_START_WITH_REQUEST: 1
      XDEBUG_CONFIG: >-
        client_host=host.docker.internal
      PHP_IDE_CONFIG: serverName=pyxis
      SERVER_NAME: pyxis.local
      FRANKENPHP_CONFIG: ''
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./:/var/www/symfony/
    ports:
      - "80:80"
      - "443:443"
    networks:
      - app_network

  db:
    image: mysql:8.2
    container_name: pyxis-mysql
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: noPassword
      MYSQL_DATABASE: bugr
    volumes:
      - db-data:/var/lib/mysql
      - ./data/dumps:/dumps
    ports:
      - "3306:3306"
    networks:
      - app_network

  mailpit:
    image: axllent/mailpit
    container_name: pyxis-mailpit
    restart: unless-stopped
    volumes:
      - mailpit-data:/data
    ports:
      - 8025:8025
      - 1025:1025
    environment:
      MP_MAX_MESSAGES: 5000
      MP_DATABASE: /data/mailpit.db
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    networks:
      - app_network

volumes:
  db-data:
  mailpit-data:

networks:
  app_network:
    name: pyxis_network